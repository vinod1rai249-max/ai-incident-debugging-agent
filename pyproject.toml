[tool.poetry]
name = "ai-genai-agentic-lab"
version = "0.1.0"
description = "Reusable AI/ML, GenAI, and Agentic AI applications"
authors = ["Vinod Rai <vinod1rai249@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
streamlit = "^1.35.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
anthropic = "^0.28.0"
openai = "^1.30.0"
langchain = "^0.2.0"
langchain-community = "^0.2.0"
chromadb = "^0.5.0"
faiss-cpu = "^1.8.0"
sentence-transformers = "^3.0.0"
scikit-learn = "^1.5.0"
torch = "^2.3.0"
transformers = "^4.41.0"
tenacity = "^8.3.0"
structlog = "^24.2.0"
opentelemetry-api = "^1.25.0"
opentelemetry-sdk = "^1.25.0"
prometheus-client = "^0.20.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
pytest-cov = "^5.0.0"
vcrpy = "^6.0.0"
mypy = "^1.10.0"
ruff = "^0.4.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"apps/ui/incident_dashboard.py" = ["E501"]
"genai/prompts/incident/root_cause_prompt.py" = ["E501"]
"apps/api/main.py" = ["E402"]
"apps/incident-correlation-agent/agent/correlation_agent.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "agents", "genai", "ml", "apps"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: end-to-end tests requiring staging environment"]

[tool.coverage.run]
source = ["core", "ml", "genai", "agents"]
omit = ["tests/*", "scripts/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"